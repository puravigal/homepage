<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a Puravigal Account | Sign up</title>
<meta name="description" content="Create your Puravigal account to get started with Puravigal products.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://www.puravigal.com/signup.html">
<link rel="icon" href="images/fav/favicon.ico"><link rel="stylesheet" href="css/site.css">\n<style>
/* Signup form control consistency and accessible validation */
.auth-card #signup-form input:not([type="checkbox"]),
.auth-card #signup-form select,
.auth-card #verify-panel input:not([type="checkbox"]) {
  display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;
  min-height:48px;padding:12px 14px;border:1px solid #d7deeb;border-radius:12px;
  background:#fff;color:#182033;font:inherit;line-height:1.4;
}
.auth-card #signup-form input[type="tel"] {appearance:none;-webkit-appearance:none;width:100%;height:48px;min-height:48px;padding:12px 14px;border:1px solid #d7deeb;border-radius:12px;font:inherit;box-sizing:border-box}
.auth-card #signup-form input:focus-visible,.auth-card #signup-form select:focus-visible,.auth-card #verify-panel input:focus-visible{outline:3px solid rgba(35,91,222,.2);outline-offset:1px;border-color:#235BDE}
.auth-card #signup-form input:invalid:not(:placeholder-shown){border-color:#d92d20}
.auth-card #signup-form .check{display:flex;align-items:flex-start;gap:10px;line-height:1.55}
.auth-card #signup-form .check input[type="checkbox"]{flex:0 0 auto;width:17px;height:17px;margin-top:3px}
.auth-card #marketing-consent-row[hidden]{display:none!important}
.auth-card #form-message:empty{display:none}
</style>
</head>
<body class="auth-page">
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="images/puravigal-black-logo.svg" alt="Puravigal" width="151"></a><nav><a href="index.html">Home</a><a href="pos/">POS</a><a href="https://accounts.puravigal.com/?mode=signin">Sign in</a></nav></div></header>
<main><section class="auth-shell"><div class="auth-card">
<span class="eyebrow">Puravigal account</span><h1 id="form-title">Create your Puravigal account.</h1>
<p class="auth-lead" id="form-description">One account for your Puravigal journey. Sign in and account security are managed centrally.</p>
<div id="form-message" role="status" aria-live="polite" class="form-note"></div>
<form id="signup-form">
<label>Full name<input id="full-name" type="text" autocomplete="name" placeholder="Your full name" required minlength="2" maxlength="120"></label>
<label>Country / calling code<select id="country-code" autocomplete="tel-country-code" required><option value="+91" data-country="IN">India (+91)</option><option value="+1" data-country="US">United States (+1)</option><option value="+44" data-country="GB">United Kingdom (+44)</option><option value="+971" data-country="AE">United Arab Emirates (+971)</option><option value="+61" data-country="AU">Australia (+61)</option><option value="+65" data-country="SG">Singapore (+65)</option><option value="+60" data-country="MY">Malaysia (+60)</option><option value="+94" data-country="LK">Sri Lanka (+94)</option><option value="+880" data-country="BD">Bangladesh (+880)</option><option value="+977" data-country="NP">Nepal (+977)</option><option value="+966" data-country="SA">Saudi Arabia (+966)</option><option value="+974" data-country="QA">Qatar (+974)</option><option value="+49" data-country="DE">Germany (+49)</option><option value="+33" data-country="FR">France (+33)</option><option value="+81" data-country="JP">Japan (+81)</option><option value="+82" data-country="KR">South Korea (+82)</option><option value="+86" data-country="CN">China (+86)</option><option value="+27" data-country="ZA">South Africa (+27)</option></select></label>
<label>Phone number<input id="phone-number" type="tel" autocomplete="tel-national" inputmode="tel" placeholder="Enter phone number" required minlength="6" maxlength="18" pattern="[0-9 ()-]{6,18}"></label>
<label>Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
<label>Password<input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" maxlength="128"></label>
<label class="check"><input id="terms" type="checkbox" required> I agree to the <a href="terms-and-conditions.html">Terms &amp; Conditions</a> and <a href="privacy-policy.html">Privacy Policy</a>.</label>
<label class="check" id="marketing-consent-row" hidden><input id="marketing-consent" type="checkbox"> Yes, I would like to receive marketing communications from Puravigal, its services, events and regional partners. This is optional and can be withdrawn at any time.</label>
<button class="btn primary auth-submit" type="submit" id="submit-button">Create account</button>
</form>
<div id="verify-panel" hidden>
<label>Email verification code<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit code" required></label>
<button class="btn primary auth-submit" id="verify-button" type="button">Verify email</button>
<button class="btn secondary auth-submit" id="resend-button" type="button">Resend code</button>
</div>
<p class="auth-switch">Already have an account? <a href="https://accounts.puravigal.com/?mode=signin">Sign in</a></p>
</div></section></main>
<footer><div class="container copyright">© 2026 Puravigal · <a href="privacy-policy.html">Privacy</a> · <a href="terms-and-conditions.html">Terms</a></div></footer>
<script>
(function(){
 const API="https://puravigal-accounts-api.onrender.com";
 const form=document.getElementById("signup-form"),msg=document.getElementById("form-message"),verify=document.getElementById("verify-panel"),submit=document.getElementById("submit-button");
 const email=document.getElementById("email"),country=document.getElementById("country-code"),phone=document.getElementById("phone-number");
 const marketingRow=document.getElementById("marketing-consent-row");
 const marketingCountries=new Set(["AT","BE","BG","HR","CY","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IE","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","GB"]);
 function updateCountryConsent(){const code=country.selectedOptions[0]?.dataset.country||"";marketingRow.hidden=!marketingCountries.has(code);if(marketingRow.hidden)document.getElementById("marketing-consent").checked=false;}
 country.addEventListener("change",updateCountryConsent);updateCountryConsent();
 email.addEventListener("input",()=>email.setCustomValidity(""));
 phone.addEventListener("input",()=>phone.setCustomValidity(""));
 function note(text,error){msg.textContent=text;msg.style.color=error?"#b42318":"#067647";}
 async function post(path,payload){const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error((typeof data.error==="string"?data.error:data.error?.message)||data.message||"Something went wrong. Please try again.");return data;}
 form.addEventListener("submit",async e=>{e.preventDefault();
 phone.setCustomValidity("");const phoneDigits=phone.value.replace(/\\D/g,"");
 if(!email.checkValidity()){email.reportValidity();return;}
 if(phoneDigits.length<6||phoneDigits.length>15){phone.setCustomValidity("Enter a valid phone number with 6–15 digits.");phone.reportValidity();return;}
 if(!form.reportValidity())return;
 submit.disabled=true;try{await post("/api/auth/product-signup",{product:"puravigal",fullName:document.getElementById("full-name").value.trim(),countryCode:document.getElementById("country-code").value,countryName:document.getElementById("country-code").selectedOptions[0].textContent,phoneNumber:phone.value.trim(),marketingConsent:document.getElementById("marketing-consent").checked,email:email.value.trim(),password:document.getElementById("password").value});form.hidden=true;verify.hidden=false;document.getElementById("form-title").textContent="Verify your email";document.getElementById("form-description").textContent="Enter the 6-digit verification code sent to "+email.value.trim()+".";note("Verification code sent. Check your inbox and spam folder.");}catch(err){note(err.message,true);}finally{submit.disabled=false;}});
 document.getElementById("verify-button").addEventListener("click",async()=>{const b=document.getElementById("verify-button");b.disabled=true;try{await post("/api/auth/verify-email",{email:email.value.trim(),otp:document.getElementById("otp").value.trim()});note("Email verified. Continue to sign in.");window.location.replace("https://accounts.puravigal.com/?mode=signin&signup=complete");}catch(err){note(err.message,true);}finally{b.disabled=false;}});
 document.getElementById("resend-button").addEventListener("click",async()=>{const b=document.getElementById("resend-button");b.disabled=true;try{await post("/api/auth/resend-verification",{email:email.value.trim()});note("If verification is still needed, a new code has been sent.");}catch(err){note(err.message,true);}finally{b.disabled=false;}});
})();
</script>
</body></html>
